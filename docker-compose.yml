version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codebase-historian-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DB_PATH=/app/data/historian.db
      - CHROMA_DB_PATH=/app/data/.chroma
    volumes:
      - ./data:/app/data
      - .:/app/repo:ro
    restart: unless-stopped

  cli:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codebase-historian-cli
    profiles:
      - cli
    environment:
      - PYTHONUNBUFFERED=1
      - DB_PATH=/app/data/historian.db
      - CHROMA_DB_PATH=/app/data/.chroma
    volumes:
      - ./data:/app/data
      - .:/app/repo:ro
    entrypoint: ["uv", "run", "historian"]
